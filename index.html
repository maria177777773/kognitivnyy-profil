<!doctype html>
<html lang="ru" data-skin="1">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="data:,">
<title>Когнитивный профиль по схеме Векслера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Rubik+Mono+One&display=swap" rel="stylesheet">
<style>
/* ===== токены: базовая тема = вариант 1 «Тетрадь» ===== */
:root{
  --bg:#f4f4f0;--surface:#fff;--surface2:#f7f7f3;--ink:#141414;--head:#0a0a0a;--mute:#5c5c5c;--line:#deded8;
  --acc:#0aba59;--acc-h:#08964a;--acc-ink:#fff;--acc-soft:#e2f5ea;--warn:#c8102e;
  --stim:#fff;--stim-line:#deded8;
  --r:18px;--r-s:12px;--btn-r:12px;--bw:1px;
  --font:'Inter',system-ui,-apple-system,sans-serif;--font-h:'Inter',system-ui,sans-serif;--font-n:'Inter',system-ui,sans-serif;
  --h-w:800;--h-tt:none;--h-ls:-.02em;--h1:42px;--h2:28px;--q:28px;
  --wrap:1100px;--btn-h:56px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.55 var(--font);-webkit-font-smoothing:antialiased}
#shell{min-height:100vh}
#app{max-width:var(--wrap);margin:0 auto;padding:40px 24px 88px}
#side{display:none}
.scr{animation:rise .32s cubic-bezier(.2,.7,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.scr{animation:none}.btn,.opt{transition:none}}
h1{font:var(--h-w) var(--h1)/1.1 var(--font-h);letter-spacing:var(--h-ls);text-transform:var(--h-tt);margin:0 0 18px;color:var(--head)}
h2{font:var(--h-w) var(--h2)/1.15 var(--font-h);letter-spacing:var(--h-ls);text-transform:var(--h-tt);margin:0 0 14px;color:var(--head)}
p{margin:0 0 14px}
.mute{color:var(--mute)}
.lead{font-size:20px;max-width:760px;color:var(--ink)}
.kicker{font-size:16px;font-weight:600;color:var(--mute);margin-bottom:6px}
.num{font-family:var(--font-n);font-variant-numeric:tabular-nums}
.card{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:28px;margin-bottom:24px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.actions{margin:4px 0 32px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--btn-h);padding:0 28px;border:2px solid var(--acc);border-radius:var(--btn-r);background:var(--acc);color:var(--acc-ink);font:600 18px var(--font);cursor:pointer;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{background:var(--acc-h);border-color:var(--acc-h)}
.btn:active{transform:scale(.98)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);background:transparent}
.btn.sm{min-height:48px;padding:0 20px;font-size:16px}
input.txt{height:var(--btn-h);border:2px solid var(--line);border-radius:var(--btn-r);padding:0 18px;font:500 20px var(--font);min-width:0;flex:1 1 220px;background:var(--surface);color:var(--ink)}
input.txt:focus{outline:none;border-color:var(--acc)}
.note{background:var(--surface2);border:var(--bw) solid var(--line);border-left:4px solid var(--acc);border-radius:var(--r-s);padding:18px 20px;font-size:16px}
/* шапка субтеста */
.hdr{margin-bottom:26px}
.segs{display:grid;grid-template-columns:repeat(10,1fr);gap:6px;margin-bottom:14px}
.segs i{height:6px;border-radius:4px;background:var(--line)}
.segs i.d{background:var(--acc)}
.segs i.c{background:var(--ink)}
.top{display:flex;justify-content:space-between;gap:12px;font-size:16px;color:var(--mute);flex-wrap:wrap}
.top b{color:var(--ink)}
/* таймер */
.tb{position:relative;height:8px;background:var(--line);border-radius:6px;margin:0 0 46px}
.tb-fill{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:6px;width:100%}
.tb.low .tb-fill{background:var(--warn)}
.tb-num{position:absolute;right:0;top:16px;font-size:16px;color:var(--mute)}
.tb.low .tb-num{color:var(--warn);font-weight:700}
.tb-ring{display:none}
.tb-ring circle{fill:none;stroke-width:6}
.tb-ring .trk{stroke:var(--line)}
.tb-ring .val{stroke:var(--acc);stroke-linecap:round;transform:rotate(-90deg);transform-origin:24px 24px}
.tb.low .tb-ring .val{stroke:var(--warn)}
/* вопрос и ответы */
.q{font:600 var(--q)/1.35 var(--font);margin:6px 0 26px;color:var(--head)}
.cap{text-align:center;font-size:16px;font-weight:500;color:var(--mute)}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.opt{display:flex;align-items:center;gap:14px;min-height:72px;background:var(--surface);border:2px solid var(--line);border-radius:var(--r-s);padding:16px 22px;font:500 19px/1.35 var(--font);color:var(--ink);text-align:left;cursor:pointer;transition:border-color .15s,background .15s,transform .1s}
.opt:hover{border-color:var(--ink)}
.opt:active{transform:scale(.99)}
.opt.picked{border-color:var(--acc);background:var(--acc-soft)}
.opt .lt{display:none}
.opts.grid{grid-template-columns:repeat(5,1fr)}
.opts.grid .opt{background:var(--stim);border-color:var(--stim-line);padding:8px;justify-content:center}
.opts.grid .opt:hover{border-color:var(--acc)}
.opts.grid .opt.picked{border-color:var(--acc);box-shadow:inset 0 0 0 2px var(--acc)}
/* стимулы: всегда на светлой карточке, как бланк */
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:380px;margin:0 auto 18px;background:var(--stim-line);padding:6px;border-radius:var(--r-s)}
.mx>div{background:var(--stim);border-radius:6px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.mx .qm{font-size:44px;font-weight:800;color:#8a8a8a}
svg.cell{width:100%;height:auto;display:block}
.scales{display:flex;flex-direction:column;align-items:center;gap:4px;margin:0 auto 16px;background:var(--stim);border:var(--bw) solid var(--stim-line);border-radius:var(--r);padding:14px;max-width:560px}
svg.scale{width:100%;max-width:420px;height:auto}
.scale-q{background:#f1f1ec;border-radius:12px}
.bd{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;align-items:flex-start;margin:6px 0 18px}
.bd figure{margin:0;text-align:center}
.bd figure>svg{margin:0 auto}
.bd figcaption{font-size:16px;color:var(--mute);margin-top:10px}
.bd-grid{display:inline-grid;gap:4px;background:#888;padding:4px;border-radius:6px}
.bd-grid button{padding:0;border:0;background:none;cursor:pointer;display:block;width:var(--bs);height:var(--bs)}
.bd-grid svg{width:100%;height:100%;display:block}
.feedback{min-height:30px;font-weight:700;text-align:center;color:var(--acc)}
.digit{font:800 120px/170px var(--font-n);text-align:center;height:170px;color:var(--head)}
.ss{display:flex;align-items:center;justify-content:center;gap:12px;flex-wrap:wrap;margin:24px 0 28px}
.ss .grp{display:flex;gap:6px;padding:10px;border:2px solid var(--stim-line);border-radius:var(--r-s);background:var(--stim)}
.ss .grp.tg{border-color:#141414}
.ss svg{width:48px;height:48px}
.ss .sep{width:2px;height:60px;background:var(--line)}
.yn .btn{min-width:160px}
.key{display:grid;grid-template-columns:repeat(9,1fr);border:2px solid #141414;border-radius:var(--r-s);overflow:hidden;max-width:620px;margin:0 auto 26px;background:var(--stim);color:#141414}
.key div{border-right:1px solid #ddd;text-align:center;padding:6px 0}
.key div:last-child{border-right:0}
.key b{display:block;font:700 20px var(--font-n);border-bottom:1px solid #ddd;padding-bottom:4px}
.key svg{width:36px;height:36px;margin-top:4px}
.strip{display:flex;justify-content:center;gap:10px;margin-bottom:24px;align-items:flex-end}
.strip span{font:700 30px var(--font-n);color:var(--mute);opacity:.55;width:48px;text-align:center}
.strip span.cur{font-size:72px;color:var(--head);opacity:1;border-bottom:4px solid var(--acc)}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;max-width:620px;margin:0 auto}
.pad button{aspect-ratio:1/1;border:2px solid var(--stim-line);border-radius:var(--r-s);background:var(--stim);cursor:pointer;padding:6px;transition:border-color .12s,transform .08s}
.pad button:hover{border-color:var(--acc)}
.pad button:active{transform:scale(.95)}
.pad svg{width:100%;height:100%}
.toggle{display:inline-flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}
/* иконки */
.ico{width:72px;height:72px;border-radius:var(--r-s);background:var(--acc-soft);color:var(--head);display:flex;align-items:center;justify-content:center;flex:none}
.ico svg{width:36px;height:36px}
/* главная */
.hero{padding:16px 0 4px}
.hero h1{font-size:calc(var(--h1) * 1.25)}
.facts{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:26px 0 28px}
.fact{background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:20px 22px}
.fact b{display:block;font:var(--h-w) 40px/1.05 var(--font-h);color:var(--head)}
.fact span{color:var(--mute);font-size:16px}
.people{margin-top:18px}
/* список субтестов */
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(460px,100%),1fr));gap:16px}
.tiles>.tile{min-width:0}
.tile{display:flex;gap:16px;align-items:center;background:var(--surface);border:var(--bw) solid var(--line);border-radius:var(--r);padding:18px 20px}
.tile .ico{width:56px;height:56px}
.tile .ico svg{width:28px;height:28px}
.tile .t{flex:1;min-width:0}
.tile .t b{display:block;font-size:19px;color:var(--head);overflow-wrap:anywhere;hyphens:auto}
.tile .t span{display:block;font-size:16px;color:var(--mute)}
.tile.done .ico{background:var(--acc);color:var(--acc-ink)}
.tile.next{border-color:var(--acc)}
.tile .r{font-weight:700;white-space:nowrap}
/* вступление */
.intro-head{display:flex;gap:20px;align-items:center;margin-bottom:18px}
.intro-head h2{margin:0}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 20px}
.chip{display:inline-flex;align-items:center;min-height:36px;padding:0 14px;border-radius:999px;background:var(--surface2);border:1px solid var(--line);font-size:16px;font-weight:500}
/* кольца */
.ring{display:block;margin:0 auto}
.ring .trk{stroke:var(--line)}
.ring .val{stroke:var(--acc)}
.ring text{fill:var(--head);font-family:var(--font-h)}
.done-wrap{text-align:center;padding:44px 28px}
.done-wrap .ring{margin-bottom:18px}
.big{font-size:22px}
/* результаты */
.idx{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:24px}
.idx .card{margin:0;padding:22px;text-align:center}
.ix-t{font-weight:600;margin-top:10px;font-size:17px}
.total{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;margin-bottom:22px}
.total b{font:var(--h-w) 48px/1 var(--font-h);color:var(--head)}
.bar{height:12px;background:var(--line);border-radius:8px;overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--acc);border-radius:8px}
.res-row{padding:14px 0;border-bottom:1px solid var(--line)}
.res-row:last-child{border-bottom:0}
.res-row .row{justify-content:space-between}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:12px 10px;text-align:left;white-space:nowrap}
th{color:var(--mute);font-weight:600}

/* ===== 2 · Ночь ===== */
[data-skin="2"]{--bg:#0a0a0a;--surface:#141414;--surface2:#1b1b1b;--ink:#e5e5e5;--head:#fff;--mute:#a0a0a0;--line:#2b2b2b;--acc:#00ff96;--acc-h:#00d880;--acc-ink:#0a0a0a;--acc-soft:#0d2a1d;--stim-line:#cfcfcf;--font-n:'JetBrains Mono',ui-monospace,monospace;color-scheme:dark}
[data-skin="2"] .top,[data-skin="2"] .kicker{font-family:var(--font-n);font-size:16px;letter-spacing:.02em}
[data-skin="2"] .ico{color:var(--acc)}
[data-skin="2"] .tile.done .ico{color:#0a0a0a}
[data-skin="2"] .segs i.c{background:#fff}
[data-skin="2"] .scale-q{background:#eaeae4}

/* ===== 3 · Плакат ===== */
[data-skin="3"]{--bg:#fff;--surface:#fff;--surface2:#f2f2f2;--ink:#0a0a0a;--head:#0a0a0a;--mute:#4a4a4a;--line:#0a0a0a;--acc:#0a0a0a;--acc-h:#262626;--acc-ink:#00ff96;--acc-soft:#00ff96;--r:0;--r-s:0;--btn-r:0;--bw:2px;--font-h:'Rubik Mono One',sans-serif;--h-w:400;--h-tt:uppercase;--h-ls:0;--h1:40px;--h2:24px}
[data-skin="3"] .hdr{border-bottom:2px solid #0a0a0a;padding-bottom:14px}
[data-skin="3"] .segs i{height:12px;border-radius:0;background:#e8e8e8}
[data-skin="3"] .segs i.d{background:#00ff96;box-shadow:inset 0 0 0 2px #0a0a0a}
[data-skin="3"] .segs i.c{background:#0a0a0a}
[data-skin="3"] .tb{height:14px;border-radius:0;background:#fff;box-shadow:inset 0 0 0 2px #0a0a0a}
[data-skin="3"] .tb-fill{border-radius:0;background:#0a0a0a}
[data-skin="3"] .opt.picked{background:#00ff96;border-color:#0a0a0a}
[data-skin="3"] .ico{background:#00ff96;box-shadow:inset 0 0 0 2px #0a0a0a}
[data-skin="3"] .tile.done .ico{background:#0a0a0a;color:#00ff96}
[data-skin="3"] .tile.next{background:#00ff96}
[data-skin="3"] .chip{border-radius:0;border:2px solid #0a0a0a;background:#fff}
[data-skin="3"] .note{border-left-width:2px;background:#00ff96}
[data-skin="3"] .bar{border-radius:0;height:14px;background:#fff;box-shadow:inset 0 0 0 2px #0a0a0a}
[data-skin="3"] .bar i{border-radius:0;background:#0a0a0a}
[data-skin="3"] .ring .val{stroke:#0a0a0a}
[data-skin="3"] .ring .trk{stroke:#00ff96}
[data-skin="3"] .feedback{color:#0a0a0a}
[data-skin="3"] .fact{background:#0a0a0a;color:#fff}
[data-skin="3"] .fact b{color:#00ff96}
[data-skin="3"] .fact span{color:#e5e5e5}

/* ===== 4 · Фокус ===== */
[data-skin="4"]{--bg:#fff;--surface:#fff;--surface2:#f6f6f6;--line:#e4e4e4;--wrap:860px;--q:32px;--h1:48px;--r:16px}
[data-skin="4"] .card{border:0;padding:0;background:none;margin-bottom:40px}
[data-skin="4"] .segs{display:none}
[data-skin="4"] .tb{position:fixed;top:0;left:0;right:0;height:6px;border-radius:0;margin:0;z-index:5;background:#eee}
[data-skin="4"] .tb-fill{border-radius:0}
[data-skin="4"] .tb-num{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);right:auto;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 14px;z-index:5}
[data-skin="4"] .hdr{margin-bottom:34px;padding-top:24px}
[data-skin="4"] .opts:not(.grid){grid-template-columns:1fr;gap:10px}
[data-skin="4"] .opt .lt{display:inline-flex;width:38px;height:38px;border-radius:50%;border:2px solid var(--line);align-items:center;justify-content:center;font-weight:700;font-size:16px;flex:none}
[data-skin="4"] .opt.picked .lt{background:var(--acc);border-color:var(--acc);color:#fff}
[data-skin="4"] .tiles{grid-template-columns:1fr;gap:0}
[data-skin="4"] .tile{border:0;border-bottom:1px solid var(--line);border-radius:0;padding:18px 0;background:none}
[data-skin="4"] .tile.next b{color:var(--acc)}
[data-skin="4"] .fact{border:0;border-top:3px solid var(--ink);border-radius:0;padding:14px 0 0;background:none}
[data-skin="4"] .ico{background:none;border:2px solid var(--line)}
[data-skin="4"] .tile.done .ico{border-color:var(--acc)}
[data-skin="4"] .idx .card{border:1px solid var(--line);padding:22px}

/* ===== 5 · Пульт ===== */
@media (min-width:960px){
  [data-skin="5"] #shell:has(#side:not([hidden])){display:grid;grid-template-columns:300px minmax(0,1fr)}
  [data-skin="5"] #side{display:block;background:#0a0a0a;color:#e5e5e5;padding:36px 24px;position:sticky;top:0;height:100vh;overflow:auto}
  [data-skin="5"] .segs{display:none}
  [data-skin="5"] #shell:has(#side:not([hidden])) #app{width:100%;padding:40px 48px 88px}
}
[data-skin="5"] .sd-t{font:700 16px var(--font);color:#00ff96;margin-bottom:22px}
[data-skin="5"] .sd-p{font:800 26px/1.15 var(--font);color:#fff;word-break:break-word}
[data-skin="5"] .sd-c{font-size:16px;color:#a0a0a0;margin:6px 0 26px}
[data-skin="5"] .sd-l{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px}
[data-skin="5"] .sd-l li{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;font-size:16px;color:#bdbdbd;border-left:3px solid transparent}
[data-skin="5"] .sd-l li .sd-i{width:24px;height:24px;flex:none;opacity:.7}
[data-skin="5"] .sd-l li em{margin-left:auto;font-style:normal;font-size:15px;color:#00ff96}
[data-skin="5"] .sd-l li.d{color:#fff}
[data-skin="5"] .sd-l li.d .sd-i{color:#00ff96;opacity:1}
[data-skin="5"] .sd-l li.c{background:#1c1c1c;color:#fff;border-left-color:#00ff96}
[data-skin="5"] .ico{background:#0a0a0a;color:#00ff96}
[data-skin="5"] .tile.done .ico{background:var(--acc);color:#fff}

/* ===== 6 · Мягкий ===== */
[data-skin="6"]{--bg:#efeeea;--surface:#fff;--surface2:#f6f5f1;--line:#e5e3dc;--r:28px;--r-s:20px;--btn-r:999px;--acc-soft:#e0f4e8;--h1:44px}
[data-skin="6"] .card,[data-skin="6"] .tile,[data-skin="6"] .fact{border-color:transparent}
[data-skin="6"] .opt{border-color:transparent}
[data-skin="6"] .opt:hover{border-color:var(--line)}
[data-skin="6"] .opt.picked{border-color:var(--acc)}
[data-skin="6"] .ico{border-radius:50%}
[data-skin="6"] .segs i{height:10px;border-radius:999px;background:#dcdad2}
[data-skin="6"] .segs i.d{background:var(--acc)}
[data-skin="6"] .segs i.c{background:var(--ink)}
[data-skin="6"] .tb{height:auto;background:none;display:flex;justify-content:flex-end;align-items:center;gap:10px;margin:-6px 0 14px}
[data-skin="6"] .tb-fill{display:none}
[data-skin="6"] .tb-ring{display:block;width:60px;height:60px}
[data-skin="6"] .tb-num{position:static;font-weight:700;font-size:18px}
[data-skin="6"] .note{border-left:0;background:#fff}
[data-skin="6"] .bar{height:14px}
[data-skin="6"] .tile.next{border-color:var(--acc)}

/* ===== телефон ===== */
@media (max-width:640px){
  :root{--h1:30px;--h2:24px;--q:21px}
  [data-skin="3"]{--h1:26px;--h2:20px}
  [data-skin="4"]{--q:24px;--h1:34px}
  #app{padding:24px 16px 72px}
  .hero h1{font-size:calc(var(--h1) * 1.15)}
  .facts{grid-template-columns:repeat(2,1fr)}
  .fact b{font-size:32px}
  .idx{grid-template-columns:repeat(2,1fr)}
  .tiles{grid-template-columns:1fr}
  .opts{grid-template-columns:1fr}
  .opt{min-height:64px;font-size:18px}
  .actions .btn{width:100%}
  .card{padding:22px}
  .opts.grid{grid-template-columns:repeat(3,1fr)}
  .digit{font-size:96px}
  .key svg{width:26px;height:26px}
  .key b{font-size:16px}
  .ss svg{width:38px;height:38px}
  .ss .sep{display:none}
  .strip span.cur{font-size:56px}
  .pad{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:360px}
  .pad button{padding:8px}
  .intro-head{gap:14px}
  .ico{width:56px;height:56px}
  .ico svg{width:28px;height:28px}

}
function mCell(c){const r=(c.count===1?[12,19,28]:[6.5,11,16])[c.size];return`<svg class="cell" viewBox="0 0 100 100">${POS[c.count].map(([x,y])=>mShape(c.shape,x,y,r,c.fill)).join('')}</svg>`}
const mKey=c=>[c.shape,c.count,c.fill,c.size].join('|');
function genMatrix(seed,rules){
  const r=rng(seed),g=[0,1,2].map(()=>[{},{},{}]);
  for(const a of Object.keys(DOM)){
    const D=DOM[a],rule=rules[a]||'fixed';let f;
    if(rule==='fixed'){const v=pick(D,r);f=()=>v}
    else if(rule==='const'){const vs=shuffle(D,r).slice(0,3);f=(i)=>vs[i]}
    else if(rule==='col'){const vs=shuffle(D,r).slice(0,3);f=(i,j)=>vs[j]}
    else if(rule==='prog'){const st=[0,1,2].map(()=>Math.floor(r()*(D.length-2))),up=r()<.5;f=(i,j)=>D[st[i]+(up?j:2-j)]}
    else{const vs=shuffle(D,r).slice(0,3),sh=r()<.5?1:2;f=(i,j)=>vs[(j+i*sh)%3]}
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)g[i][j][a]=f(i,j);
  }
  const ans=g[2][2],vary=Object.keys(rules),fixed=Object.keys(DOM).filter(a=>!rules[a]);
  const seen=new Set([mKey(ans)]),dis=[];
  const add=c=>{if(dis.length<4&&!seen.has(mKey(c))){seen.add(mKey(c));dis.push(c)}};
  const inM=(a,v)=>g.flat().some(c=>c[a]===v);
  if(vary.length>=2){const[a,b]=shuffle(vary,r);const va=DOM[a].filter(v=>v!==ans[a]&&inM(a,v)),vb=DOM[b].filter(v=>v!==ans[b]&&inM(b,v));if(va.length&&vb.length)add({...ans,[a]:pick(va,r),[b]:pick(vb,r)})}
  const single=[];for(const a of vary)for(const v of DOM[a])if(v!==ans[a])single.push({...ans,[a]:v});
  const sh=shuffle(single,r);sh.filter(c=>vary.every(a=>inM(a,c[a]))).forEach(add);sh.forEach(add);
  for(const a of shuffle(fixed,r))for(const v of shuffle(DOM[a],r))add({...ans,[a]:v});
  const opts=shuffle([ans,...dis],r);
  const cells=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)cells.push(i===2&&j===2?'<div><span class="qm">?</span></div>':`<div>${mCell(g[i][j])}</div>`);
  return{q:`<div class="mx">${cells.join('')}</div><div class="cap">Какой фрагмент должен стоять на месте знака вопроса?</div>`,opts:opts.map(mCell),ans:opts.indexOf(ans),grid:true};
}
const MR=[
 [11,{shape:'const'}],[12,{count:'prog'}],[13,{fill:'latin'}],[14,{shape:'latin'}],
 [15,{size:'prog',fill:'const'}],[16,{count:'prog',shape:'const'}],[17,{shape:'latin',fill:'latin'}],[18,{count:'latin',size:'prog'}],

  if(t==='C')return`<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;

function fwPile(str,cx,base,s=24,per=4){let out='';const a=str.split('');for(let k=0;k<a.length;k++){const row=Math.floor(k/per),inRow=Math.min(per,a.length-row*per),col=k%per;out+=fwOne(a[k],cx+(col-(inRow-1)/2)*(s+4),base-s/2-row*(s+4),s)}return out}
function fwScale(l,r,q){return`<svg class="scale${q?' scale-q':''}" viewBox="0 0 340 120"><polygon points="170,86 156,114 184,114" fill="#555"/><line x1="16" y1="86" x2="324" y2="86" stroke="#555" stroke-width="5" stroke-linecap="round"/>${fwPile(l,90,80)}${q?'<text x="250" y="72" font-size="46" font-weight="800" text-anchor="middle" fill="#888" font-family="Inter,sans-serif">?</text>':fwPile(r,250,80)}</svg>`}

const FW_ITEMS=[
 [{C:1,S:2},[['S','CC']],'SS',['CCCC','CCC','SC','CCCCC','C']],
 [{C:1,T:3},[['T','CCC']],'TC',['CCCC','CCC','CCCCC','TT','CC']],

 [{C:1,S:2,T:4},[['S','CC'],['T','SS']],'T',['CCCC','CCC','SC','SSC','CCCCCC']],
 [{C:1,S:3,D:2},[['S','CCC'],['D','CC']],'SD',['CCCCC','DD','SS','CCCC','DDD']],
 [{C:1,S:2,T:3},[['S','CC'],['T','SC']],'TT',['SSS','SSC','TC','SSSS','CCCCC']],
 [{C:2,S:3},[['CCC','SS']],'SSSS',['CCCCCC','CCCCC','CCCC','SSSC','SSCC']],
 [{C:1,S:2,T:3,D:4},[['S','CC'],['T','SC'],['D','TC']],'DS',['TT','TS','DD','TTC','SS']],
 [{C:3,S:2,T:6},[['CC','SSS'],['T','CC']],'TS',['SSSS','CCC','SSS','TCS','CC']],

const wsum=(w,s)=>s.split('').reduce((a,c)=>a+w[c],0);

/* ===== общий раннер выбора ответа ===== */
function runMC(cfg,done){
  let i=0,raw=0,zeros=0;
  const next=()=>{
    if(i>=cfg.items.length||zeros>=cfg.stop)return done(raw,cfg.items.length);
    const it=cfg.items[i];
    h(`${hdrTop(cfg.title,`задание ${i+1} из ${cfg.items.length}`)}${cfg.time?TB:''}<div class="q">${it.q}</div><div class="opts${it.grid?' grid':''}">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${it.grid?o:`<span class="lt">${'АБВГД'[k]}</span><span>${o}</span>`}</button>`).join('')}</div>`);
    let t=null,fin=false;
    const finish=k=>{if(fin)return;fin=true;t&&t.stop();const b=app.querySelector(`.opt[data-k="${k}"]`);if(b)b.classList.add('picked');const ok=k===it.ans;raw+=ok?1:0;zeros=ok?0:zeros+1;i++;setTimeout(next,260)};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(+b.dataset.k));
    if(cfg.time)t=timer(app.querySelector('.tb'),cfg.time,()=>finish(-1));
  };
  next();
}

/* ===== арифметика ===== */
function runAR(done){
  let i=0,raw=0,zeros=0;
  const next=()=>{
    if(i>=ARI.length||zeros>=3)return done(raw,ARI.length);
    const[q,a]=ARI[i];
    h(`${hdrTop('Арифметика',`задача ${i+1} из ${ARI.length}`)}${TB}<div class="q">${esc(q)}</div><form class="row" id="f"><input class="txt" id="a" inputmode="decimal" autocomplete="off" placeholder="Ответ числом"><button class="btn">Ответить</button></form>`);
    const inp=document.getElementById('a');inp.focus();let fin=false;
    const finish=v=>{if(fin)return;fin=true;t.stop();const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));const ok=n===a;raw+=ok?1:0;zeros=ok?0:zeros+1;i++;setTimeout(next,120)};
    const t=timer(app.querySelector('.tb'),30,()=>finish(inp.value));
    document.getElementById('f').onsubmit=e=>{e.preventDefault();if(inp.value.trim())finish(inp.value)};

}

/* ===== повторение цифр ===== */
function runDS(done){
  const voice=document.getElementById('voice')?.checked;
  const r=rng(505),parts=[{name:'Прямой порядок',from:2,to:9,tr:s=>s},{name:'Обратный порядок',from:2,to:8,tr:s=>s.slice().reverse()},{name:'По возрастанию',from:2,to:9,tr:s=>s.slice().sort((a,b)=>a-b)}];
  const seq=len=>{const s=[];while(s.length<len){const d=1+Math.floor(r()*9);if(!s.includes(d))s.push(d)}return s};
  const plan=parts.map(p=>{const L=[];for(let len=p.from;len<=p.to;len++)L.push([seq(len),seq(len)]);return L});
  const max=plan.reduce((a,p)=>a+p.length*2,0);
  let raw=0,pi=0,li=0,ti=0,fails=0;
  if(voice&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
  const say=d=>{if(!voice||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(String(d));u.lang='ru-RU';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u)};
  const step=()=>{
    if(pi>=parts.length)return done(raw,max);
    if(li>=plan[pi].length||(ti===0&&fails>=2)){pi++;li=0;ti=0;fails=0;return pi<parts.length?partIntro():done(raw,max)}
    const s=plan[pi][li][ti];
    h(`${hdrTop(`Повторение цифр · ${parts[pi].name}`,`${s.length} цифр, попытка ${ti+1}`)}<div class="digit" id="dg"></div><p class="cap">Смотрите внимательно</p>`);
    const dg=document.getElementById('dg');let k=0;
    const show=()=>{if(k>=s.length){dg.textContent='';return setTimeout(ask,400)}dg.textContent=s[k];say(s[k]);setTimeout(()=>{dg.textContent='';k++;setTimeout(show,300)},700)};
    setTimeout(show,800);
    const ask=()=>{
      h(`${hdrTop(`Повторение цифр · ${parts[pi].name}`,`${s.length} цифр, попытка ${ti+1}`)}<div class="q">Введите цифры ${pi===0?'в том же порядке':pi===1?'в обратном порядке':'по возрастанию'}</div><form class="row" id="f"><input class="txt" id="a" inputmode="numeric" autocomplete="off" placeholder="Например: 3 8 1"><button class="btn">Ответить</button></form>`);
      const inp=document.getElementById('a');inp.focus();
      document.getElementById('f').onsubmit=e=>{e.preventDefault();const got=inp.value.replace(/\D/g,'');const ok=got===parts[pi].tr(s).join('');
        raw+=ok?1:0;if(ti===0){fails=ok?0:1;ti=1}else{fails+=ok?0:1;ti=0;li++;if(fails<2)fails=0}step()};
    };
  };
  const partIntro=()=>{h(`${hdrTop('Повторение цифр',`часть ${pi+1} из 3`)}<div class="card"><div class="kicker">Часть ${pi+1} из 3</div><h2>${parts[pi].name}</h2><p>${pi===0?'Повторите цифры точно в том порядке, в каком они появились.':pi===1?'Теперь повторите цифры <b>с конца</b>. Например, показали 3 8 1, вводите 1 8 3.':'Теперь введите цифры <b>по возрастанию</b>. Например, показали 7 2 5, вводите 2 5 7.'}</p><button class="btn" id="go">Начать</button></div>`);document.getElementById('go').onclick=step};
  partIntro();
}

    const g=document.getElementById('g');let fin=false;
    const draw=()=>{g.innerHTML=cur.map((t,k)=>`<button data-k="${k}" aria-label="кубик ${k+1}"><svg viewBox="0 0 60 60">${bdFace(t,0,0,60)}</svg></button>`).join('');
      g.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(fin)return;const k=+b.dataset.k;cur[k]=(cur[k]+1)%6;draw();check()})};
    const t=timer(app.querySelector('.tb'),it.lim,()=>{if(fin)return;fin=true;fails++;document.getElementById('fb').textContent='Время вышло';i++;setTimeout(next,900)});
    const check=()=>{if(cur.every((v,k)=>v===it.p[k])){fin=true;const el=t.elapsed();t.stop();fails=0;let pts=n===2?2:4;if(n===3){const q=el/it.lim;pts+=q<=.4?3:q<=.6?2:q<=.8?1:0}raw+=pts;document.getElementById('fb').textContent='Узор собран';i++;setTimeout(next,700)}};
    draw();
  };
  next();
}

/* ===== поиск символов ===== */
function runSS(done){
  const r=rng(606),rows=[];
  for(let k=0;k<60;k++){const a=Math.floor(r()*16);let b;do{b=Math.floor(r()*16)}while(b===a);const yes=r()<.5;
    const near=[PAIR[a],PAIR[b]].filter(x=>x!==a&&x!==b),pool=[...Array(16).keys()].filter(x=>x!==a&&x!==b);
    const grp=[];while(grp.length<5){const x=r()<.45&&near.length?pick(near,r):pick(pool,r);if(!grp.includes(x))grp.push(x)}
    if(yes)grp[Math.floor(r()*5)]=r()<.5?a:b;
    rows.push({t:[a,b],g:grp,yes:grp.includes(a)||grp.includes(b)})}
  let i=0,ok=0,bad=0,end=false;
  h(`${hdrTop('Поиск символов','строка 1','cnt')}${TB}<div id="row"></div><div class="row yn" style="justify-content:center;gap:16px"><button class="btn" id="y">Да</button><button class="btn ghost" id="n">Нет</button></div>`);
  const draw=()=>{const x=rows[i];document.getElementById('cnt').textContent='строка '+(i+1);document.getElementById('row').innerHTML=`<div class="ss"><div class="grp tg">${x.t.map(glyph).join('')}</div><div class="sep"></div><div class="grp">${x.g.map(glyph).join('')}</div></div>`};
  const finish=()=>{if(end)return;end=true;t.stop();done(Math.max(0,ok-bad),rows.length)};
  const ans=v=>{if(end)return;(v===rows[i].yes)?ok++:bad++;i++;if(i>=rows.length)return finish();draw()};
  document.getElementById('y').onclick=()=>ans(true);document.getElementById('n').onclick=()=>ans(false);
  const t=timer(app.querySelector('.tb'),120,finish);draw();
}

/* ===== шифровка ===== */
function runCD(done){
  const r=rng(707),sym=shuffle([...Array(16).keys()],r).slice(0,9),padOrd=shuffle([0,1,2,3,4,5,6,7,8],r),N=135,seq=[];
  for(let k=0;k<N;k++){let d;do{d=Math.floor(r()*9)}while(k&&d===seq[k-1]);seq.push(d)}
  let i=0,ok=0,end=false;
  h(`${hdrTop('Шифровка','0 верно','cnt')}${TB}<div class="key">${sym.map((s,k)=>`<div><b>${k+1}</b>${glyph(s)}</div>`).join('')}</div><div class="strip" id="strip"></div><div class="pad">${padOrd.map(k=>`<button data-k="${k}" aria-label="символ">${glyph(sym[k])}</button>`).join('')}</div>`);
  const draw=()=>{document.getElementById('strip').innerHTML=[0,1,2,3,4].map(o=>seq[i+o]===undefined?'':`<span class="${o?'':'cur'}">${seq[i+o]+1}</span>`).join('')};
  const finish=()=>{if(end)return;end=true;t.stop();done(ok,N)};
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(end)return;if(+b.dataset.k===seq[i])ok++;document.getElementById('cnt').textContent=ok+' верно';i++;if(i>=N)return finish();draw()});
  const t=timer(app.querySelector('.tb'),120,finish);draw();
}

/* ===== экраны ===== */
const COUNT={bd:`${BD.length} узоров`,sim:`${SIM.length} заданий`,ds:'46 рядов цифр',mr:`${MR.length} заданий`,voc:`${VOC.length} слов`,ar:`${ARI.length} задач`,ss:'60 строк',fw:`${FW.length} заданий`,inf:`${INF.length} вопрос`,cd:'135 цифр'};
const TAG={bd:'от 45 до 120 сек на узор',sim:'без таймера',ds:'без таймера',mr:'без таймера',voc:'без таймера',ar:'30 сек на задачу',ss:'ровно 120 сек',fw:'30 сек на задание',inf:'без таймера',cd:'ровно 120 сек'};
const TOTAL=BD.length+SIM.length+46+MR.length+VOC.length+ARI.length+60+FW.length+INF.length+135;

function home(){
  CUR=null;const names=Object.keys(S.people);
  h(`<section class="hero"><div class="kicker">По схеме шкалы Векслера для взрослых (WAIS-IV)</div><h1>Когнитивный профиль</h1>
  <p class="lead">10 субтестов в оригинальном порядке, 4 шкалы, оригинальные лимиты времени и правила остановки. Проходите в тишине, без бумаги и калькулятора.</p></section>
  <div class="facts"><div class="fact"><b class="num">10</b><span>субтестов</span></div><div class="fact"><b class="num">${TOTAL}</b><span>задание</span></div><div class="fact"><b class="num">4</b><span>шкалы</span></div><div class="fact"><b class="num">≈60</b><span>минут</span></div></div>
  <div class="card"><h2>Кто проходит?</h2><form class="row" id="f"><input class="txt" id="nm" placeholder="Ваше имя" autocomplete="off" maxlength="40"><button class="btn">Начать</button></form>
  ${names.length?`<div class="people"><p class="mute" style="margin:0 0 10px">Или продолжить:</p><div class="row">${names.map(n=>`<button class="btn ghost" data-n="${esc(n)}">${esc(n)} · ${Object.keys(S.people[n].res||{}).length} из 10</button>`).join('')}<button class="btn ghost" id="cmp">Сравнить участников</button></div></div>`:''}</div>
  <div class="note"><b>Важно.</b> Задания здесь авторские: оригинальные материалы и нормы Векслера защищены авторским правом издателя и выдаются только психологам. Поэтому тест показывает <b>профиль сильных и слабых сторон</b>, а не официальный IQ. Можно прерваться: пройденные субтесты сохраняются в этом браузере.</div>`);
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const n=document.getElementById('nm').value.trim();if(!n)return;S.people[n]=S.people[n]||{res:{}};S.current=n;save();battery()};
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.current=b.dataset.n;save();battery()});
  const c=document.getElementById('cmp');if(c)c.onclick=compare;
}
function battery(){
  CUR=null;const p=me(),res=p.res,nextS=SUB.find(s=>!res[s.id]),cnt=Object.keys(res).length;
  h(`<div class="hdr">${segs(nextS?.id)}<div class="top"><span>Участник: <b>${esc(S.current)}</b></span><span class="num">пройдено ${cnt} из 10</span></div></div>
  <h1>${nextS?(cnt?'Продолжим':'Готовы начать?'):'Все субтесты пройдены'}</h1>
  <p class="lead">${nextS?`Следующий субтест: <b>${nextS.name}</b>, около ${nextS.min} минут.`:'Можно посмотреть свой профиль.'}</p>
  <div class="row actions">${nextS?`<button class="btn" id="go">${cnt?'Продолжить':'Начать'}: ${nextS.name}</button>`:''}${cnt?`<button class="btn ${nextS?'ghost':''}" id="rs">Результаты</button>`:''}<button class="btn ghost" id="hm">Сменить участника</button></div>
  <div class="tiles">${SUB.map((s,k)=>{const x=res[s.id];return`<div class="tile${x?' done':''}${s===nextS?' next':''}"><div class="ico">${icon(s.id)}</div><div class="t"><span class="num">${k+1} · ${IDX[s.idx]}</span><b>${s.name}</b><span>${COUNT[s.id]} · ${TAG[s.id]}</span></div><div class="r">${x?`<span class="num">${x.raw}/${x.max}</span>`:`<button class="btn ghost sm" data-s="${s.id}">Пройти</button>`}</div></div>`}).join('')}</div>`);
  const go=document.getElementById('go');if(go)go.onclick=()=>intro(nextS);
  const rs=document.getElementById('rs');if(rs)rs.onclick=()=>results();
  document.getElementById('hm').onclick=home;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>intro(SUB.find(s=>s.id===b.dataset.s)));
}
function intro(s){
  CUR=s;const k=SUB.indexOf(s)+1;
  h(`${hdrTop(`Участник: <b>${esc(S.current)}</b>`,`субтест ${k} из 10`)}<div class="card intro"><div class="intro-head"><div class="ico">${icon(s.id)}</div><div><div class="kicker">Субтест ${k} из 10 · ${IDX[s.idx]}</div><h2>${s.name}</h2></div></div>
  <div class="chips"><span class="chip">${COUNT[s.id]}</span><span class="chip">${TAG[s.id]}</span><span class="chip">около ${s.min} мин</span></div>
  ${s.intro}<div class="row" style="margin-top:22px"><button class="btn" id="go">Начать</button><button class="btn ghost" id="bk">Назад</button></div></div>`);
  document.getElementById('bk').onclick=battery;
  document.getElementById('go').onclick=()=>s.run((raw,max)=>{me().res[s.id]={raw,max,at:new Date().toISOString()};save();doneScreen(s,raw,max)});
}
function doneScreen(s,raw,max){
  const res=me().res,cnt=Object.keys(res).length,nx=SUB.find(x=>!res[x.id]);CUR=null;
  h(`<div class="card done-wrap">${ringSVG(cnt/10,`${cnt}/10`,140)}<div class="kicker">Субтест ${SUB.indexOf(s)+1} из 10 пройден</div><h2>${s.name}</h2><p class="big" id="resline">Результат: <b class="num">${raw} из ${max}</b></p>
  <p class="mute">${nx?`Дальше: ${nx.name}. Можно сделать короткую паузу.`:'Это был последний субтест.'}</p><div class="row" style="justify-content:center;margin-top:8px"><button class="btn" id="nx">${nx?'Дальше':'К результатам'}</button><button class="btn ghost" id="bk">К списку</button></div></div>`);
  document.getElementById('nx').onclick=()=>nx?intro(nx):results();
  document.getElementById('bk').onclick=battery;
}
function calc(p){
  const pct=id=>{const x=p.res[id];return x?Math.round(x.raw/x.max*100):null};
  const idx={};for(const k in IDX){const v=SUB.filter(s=>s.idx===k).map(s=>pct(s.id)).filter(v=>v!==null);idx[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
  const all=SUB.map(s=>pct(s.id)).filter(v=>v!==null);
  return{pct,idx,total:all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):null};
}
function results(){
  CUR=null;const p=me(),c=calc(p),done=Object.keys(p.res).length;
  const lines=[`Когнитивный профиль: ${S.current}`,...Object.keys(IDX).map(k=>`${IDX[k]}: ${c.idx[k]??'нет'}%`),'',...SUB.filter(s=>p.res[s.id]).map(s=>`${s.name}: ${p.res[s.id].raw} из ${p.res[s.id].max}`),`Общий балл: ${c.total}%`];
  h(`<div class="hdr">${segs()}<div class="top"><span>Участник: <b>${esc(S.current)}</b></span><span class="num">пройдено ${done} из 10</span></div></div>
  <h1>Профиль: ${esc(S.current)}</h1>
  <div class="total"><b class="num">${c.total??'·'}%</b><span class="mute">общий балл по ${done} субтестам</span></div>
  <div class="idx">${Object.keys(IDX).map(k=>`<div class="card">${ringSVG((c.idx[k]||0)/100,c.idx[k]===null?'·':c.idx[k]+'%',110)}<div class="ix-t">${IDX[k]}</div></div>`).join('')}</div>
  <div class="card"><h2>По субтестам</h2>${SUB.map(s=>{const x=p.res[s.id];return`<div class="res-row"><div class="row"><span><b>${s.name}</b> <span class="mute">· ${IDX[s.idx]}</span></span><span class="num">${x?`${x.raw} из ${x.max}`:'не пройден'}</span></div><div class="bar"><i style="width:${x?c.pct(s.id):0}%"></i></div></div>`}).join('')}</div>
  <div class="note" style="margin-bottom:24px">Проценты показывают долю набранных баллов, а не IQ. В «Поиске символов» и «Шифровке» максимум, как в оригинале, почти недостижим за 120 секунд, поэтому скорость обработки всегда выглядит ниже остальных шкал. Честно сравнивать можно людей между собой: все проходят одни и те же задания.</div>
  <div class="row"><button class="btn" id="cp">Скопировать результат</button><button class="btn ghost" id="bk">К субтестам</button><button class="btn ghost" id="cm">Сравнить участников</button></div><p class="mute" id="cpok" style="margin-top:12px"></p>`);
  document.getElementById('cp').onclick=()=>{const txt=lines.join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>document.getElementById('cpok').textContent='Скопировано, можно вставить в мессенджер',()=>{document.getElementById('cpok').innerHTML='<textarea style="width:100%;height:220px;font:16px Inter">'+esc(txt)+'</textarea>'})};
  document.getElementById('bk').onclick=battery;document.getElementById('cm').onclick=compare;
}
function compare(){
  CUR=null;const names=Object.keys(S.people);
  h(`<h1>Сравнение участников</h1><div class="card tbl-wrap"><table><tr><th>Участник</th>${Object.values(IDX).map(v=>`<th>${v}</th>`).join('')}<th>Общий</th><th>Пройдено</th></tr>
  ${names.map(n=>{const c=calc(S.people[n]);return`<tr><td><b>${esc(n)}</b></td>${Object.keys(IDX).map(k=>`<td class="num">${c.idx[k]===null?'·':c.idx[k]+'%'}</td>`).join('')}<td class="num"><b>${c.total===null?'·':c.total+'%'}</b></td><td class="num">${Object.keys(S.people[n].res).length} из 10</td></tr>`}).join('')}</table></div>
  <p class="mute">Сравнение видно только на этом устройстве. Если проходили на разных телефонах, обменяйтесь результатами кнопкой «Скопировать результат».</p><button class="btn ghost" id="bk">Назад</button>`);
  document.getElementById('bk').onclick=()=>S.current&&S.people[S.current]?battery():home();
}

/* ===== панель вариантов оформления ===== */
const DEMO_PART={bd:{raw:31,max:45},sim:{raw:12,max:16},ds:{raw:29,max:46},mr:{raw:13,max:18}};
const DEMO_FULL={...DEMO_PART,voc:{raw:14,max:18},ar:{raw:10,max:14},ss:{raw:38,max:60},fw:{raw:8,max:12},inf:{raw:17,max:22},cd:{raw:72,max:135}};
const JUMPS=[['home','Главная'],['bat','Список'],['intro','Вступление'],['bd','Кубики'],['mr','Матрицы'],['fw','Весы'],['sim','Текстовый вопрос'],['ar','Арифметика'],['ss','Поиск символов'],['cd','Шифровка'],['done','Субтест пройден'],['res','Результаты']];
function panel(){
  let hidden=[];try{hidden=JSON.parse(localStorage.getItem('wx-hidden')||'[]')}catch(e){}
  const el=document.createElement('div');el.id='vt';
  el.innerHTML=`<div class="drag-handle"><span>Оформление теста</span><button id="vt-min" aria-label="Свернуть">–</button></div><div class="vt-body"><div id="vt-list"></div><button class="vt-btn vt-wide" id="vt-rest">Вернуть скрытые</button><div class="vt-sec">Экраны</div><div class="vt-jump">${JUMPS.map(([k,n])=>`<button class="vt-btn" data-go="${k}">${n}</button>`).join('')}</div><button class="vt-btn vt-ok" id="vt-ok">✓ Утвердить</button><div id="vt-toast"></div></div>`;
  document.body.appendChild(el);
  const list=()=>{document.getElementById('vt-list').innerHTML=SKINS.filter(([n])=>!hidden.includes(n)).map(([n,name])=>`<div class="vt-row"><button class="vt-pick${n===skin?' on':''}" data-k="${n}">${n} · ${name}</button><button class="vt-x" data-x="${n}" aria-label="Убрать из сравнения">×</button></div>`).join('');
    el.querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>{skin=+b.dataset.k;document.documentElement.dataset.skin=skin;try{localStorage.setItem('wx-skin',skin)}catch(e){}list()});
    el.querySelectorAll('[data-x]').forEach(b=>b.onclick=()=>{hidden.push(+b.dataset.x);try{localStorage.setItem('wx-hidden',JSON.stringify(hidden))}catch(e){}list()});
    document.getElementById('vt-rest').hidden=!hidden.length};
  list();
  document.getElementById('vt-rest').onclick=()=>{hidden=[];try{localStorage.removeItem('wx-hidden')}catch(e){}list()};
  el.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{const u=new URL(location.href);u.searchParams.set('go',b.dataset.go);u.searchParams.set('skin',skin);location.href=u.toString()});
  document.getElementById('vt-ok').onclick=()=>{const s=SKINS.find(x=>x[0]===skin),txt=`Утверждаю оформление теста: V${skin} «${s[1]}»`;const t=document.getElementById('vt-toast');
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>t.textContent='Скопировано: '+txt,()=>t.textContent=txt)};
  let min=false;try{min=localStorage.getItem('wx-vt-min')==='1'}catch(e){}el.classList.toggle('min',min);
  document.getElementById('vt-min').onclick=()=>{min=!min;el.classList.toggle('min',min);try{localStorage.setItem('wx-vt-min',min?'1':'0')}catch(e){}};
  if(window.DragPanel)DragPanel.make(el,{key:'wx-vt',handle:'.drag-handle',side:'right',top:()=>innerWidth<640?innerHeight-80:110});
}
function boot(){
  const go=PREVIEW&&QS.get('go');
  if(go){save=()=>{};
    S={people:{'Пример':{res:go==='res'?{...DEMO_FULL}:{...DEMO_PART}}},current:'Пример'};
    if(go==='home'){S={people:{'Анна':{res:{...DEMO_PART}},'Пример':{res:{}}},current:null};home()}
    else if(go==='bat')battery();
    else if(go==='res')results();
    else if(go==='intro')intro(SUB[3]);
    else if(go==='done'){S.people['Пример'].res.voc={raw:14,max:18};doneScreen(SUB[4],14,18)}
    else{const s=SUB.find(x=>x.id===go);if(s){CUR=s;s.run(()=>battery())}else home()}
  }else S.current&&S.people[S.current]?battery():home();
  if(PREVIEW)panel();
}
boot();
</script>
