<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Когнитивный профиль по схеме Векслера</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f6f6f2;--card:#fff;--ink:#141414;--mute:#666;--line:#dcdcd6;--acc:#0aba59;--acc-d:#08964a;--red:#c8102e;--btn-h:52px}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:18px/1.5 Inter,system-ui,-apple-system,sans-serif}
#app{max-width:980px;margin:0 auto;padding:32px 16px 64px}
h1{font-size:34px;line-height:1.15;margin:0 0 16px;font-weight:800}
h2{font-size:26px;margin:0 0 12px;font-weight:800}
p{margin:0 0 14px}
.mute{color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px;margin-bottom:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:var(--btn-h);padding:0 26px;border:0;border-radius:12px;background:var(--acc);color:#fff;font:600 18px Inter,system-ui,sans-serif;cursor:pointer}
.btn:hover{background:var(--acc-d)}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}
input.txt{height:var(--btn-h);border:1.5px solid var(--line);border-radius:12px;padding:0 16px;font:500 20px Inter,system-ui,sans-serif;min-width:0;flex:1 1 220px}
input.txt:focus{outline:none;border-color:var(--acc)}
.top{display:flex;justify-content:space-between;gap:12px;font-size:15px;color:var(--mute);margin-bottom:12px;flex-wrap:wrap}
.tb{position:relative;height:10px;background:#e6e6e0;border-radius:6px;margin-bottom:40px}
.tb-fill{position:absolute;inset:0 auto 0 0;background:var(--acc);border-radius:6px;width:100%}
.tb-num{position:absolute;right:0;top:14px;font-size:14px;color:var(--mute)}
.q{font-size:22px;font-weight:600;margin:12px 0 22px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.opts.grid{grid-template-columns:repeat(5,1fr)}
.opt{min-height:var(--btn-h);background:#fff;border:1.5px solid var(--line);border-radius:12px;padding:12px 16px;font:500 18px Inter,system-ui,sans-serif;text-align:left;cursor:pointer;color:var(--ink)}
.opt:hover{border-color:var(--ink)}
.opts.grid .opt{padding:6px;text-align:center}
.list{display:flex;flex-direction:column;gap:10px}
.st{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 18px}
.st .n{width:34px;height:34px;border-radius:50%;background:#eee;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex:none}
.st.done .n{background:var(--acc);color:#fff}
.st .t{flex:1;min-width:0}
.st .t b{display:block}
.st .t span{font-size:15px;color:var(--mute)}
.st .r{font-weight:700;font-size:16px;white-space:nowrap}
/* матрицы */
.mx{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;max-width:380px;margin:0 auto 22px;background:var(--line);padding:6px;border-radius:12px}
.mx>div{background:#fff;border-radius:6px;aspect-ratio:1/1;display:flex;align-items:center;justify-content:center}
.mx .qm{font-size:44px;font-weight:800;color:var(--mute)}
svg.cell{width:100%;height:auto;display:block}
/* весы */
.scales{display:flex;flex-direction:column;align-items:center;gap:4px;margin-bottom:18px}
svg.scale{width:100%;max-width:420px;height:auto}
.scale-q{background:#fffbe6;border-radius:12px}
/* кубики */
.bd{display:flex;gap:40px;justify-content:center;flex-wrap:wrap;align-items:flex-start;margin:10px 0 18px}
.bd figure{margin:0;text-align:center}
.bd figcaption{font-size:15px;color:var(--mute);margin-top:8px}
.bd-grid{display:inline-grid;gap:4px;background:#888;padding:4px;border-radius:6px}
.bd-grid button{padding:0;border:0;background:none;cursor:pointer;display:block;width:var(--bs);height:var(--bs)}
.bd-grid svg{width:100%;height:100%;display:block}
/* цифры */
.digit{font-size:120px;font-weight:800;text-align:center;height:170px;line-height:170px;font-variant-numeric:tabular-nums}
/* поиск символов, шифровка */
.ss{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:24px 0}
.ss .grp{display:flex;gap:6px;padding:10px;border:1.5px solid var(--line);border-radius:12px;background:#fff}
.ss .grp.tg{border-color:var(--ink)}
.ss svg{width:48px;height:48px}
.ss .sep{width:2px;height:60px;background:var(--line)}
.key{display:grid;grid-template-columns:repeat(9,1fr);border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;max-width:620px;margin:0 auto 26px;background:#fff}
.key div{border-right:1px solid var(--line);text-align:center;padding:6px 0}
.key div:last-child{border-right:0}
.key b{display:block;font-size:20px;border-bottom:1px solid var(--line);padding-bottom:4px}
.key svg{width:36px;height:36px;margin-top:4px}
.strip{display:flex;justify-content:center;gap:10px;margin-bottom:24px;align-items:flex-end}
.strip span{font-size:30px;color:#bbb;font-weight:700;width:48px;text-align:center}
.strip span.cur{font-size:72px;color:var(--ink);border-bottom:4px solid var(--acc)}
.pad{display:grid;grid-template-columns:repeat(9,minmax(0,1fr));gap:8px;max-width:620px;margin:0 auto}
.pad button{aspect-ratio:1/1;border:1.5px solid var(--line);border-radius:10px;background:#fff;cursor:pointer;padding:6px}
.pad button:hover{border-color:var(--ink)}
.pad svg{width:100%;height:100%}
/* результаты */
.bar{height:14px;background:#e6e6e0;border-radius:8px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
.res-row{padding:12px 0;border-bottom:1px solid var(--line)}
.res-row:last-child{border-bottom:0}
.res-row .row{justify-content:space-between}
.idx{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px;margin-bottom:24px}
.idx .card{margin:0;padding:18px}
.idx .v{font-size:40px;font-weight:800;line-height:1.1}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{border-bottom:1px solid var(--line);padding:10px 8px;text-align:left;white-space:nowrap}
.note{background:#fff8e1;border:1px solid #f0dfa0;border-radius:12px;padding:16px 18px;font-size:16px}
.toggle{display:inline-flex;gap:10px;align-items:center;font-size:16px;cursor:pointer}
.toggle input{width:22px;height:22px}
.feedback{min-height:28px;font-weight:600;text-align:center}
@media (max-width:560px){
  h1{font-size:28px}
  #app{padding-top:20px}
  .opts.grid{grid-template-columns:repeat(3,1fr)}
  .digit{font-size:96px}
  .key svg{width:26px;height:26px}
  .key b{font-size:16px}
  .ss svg{width:38px;height:38px}
  .ss .sep{display:none}
  .strip span.cur{font-size:56px}
  .pad{grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-width:360px}
  .pad button{padding:8px}
}
</style>
</head>

const app=document.getElementById('app');

function rng(seed){let a=seed>>>0;return()=>{a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const pick=(arr,r)=>arr[Math.floor(r()*arr.length)];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function timer(el,sec,onEnd){
  const start=performance.now();let raf,stopped=false;
  const fill=el.querySelector('.tb-fill'),num=el.querySelector('.tb-num');
  const tick=()=>{if(stopped)return;const t=(performance.now()-start)/1000,left=Math.max(0,sec-t);
    fill.style.width=(left/sec*100)+'%';num.textContent=Math.ceil(left)+' сек';
    if(left<=0){stopped=true;onEnd();return}raf=requestAnimationFrame(tick)};
  tick();
  return{stop(){stopped=true;cancelAnimationFrame(raf)},elapsed(){return(performance.now()-start)/1000}};
}

const DOM={shape:['circle','square','triangle','diamond','hexagon'],count:[1,2,3,4],fill:['white','grey','black'],size:[0,1,2]};
const POS={1:[[50,50]],2:[[29,50],[71,50]],3:[[50,29],[29,71],[71,71]],4:[[29,29],[71,29],[29,71],[71,71]]};
function polyPts(n,cx,cy,r,rot){let p=[];for(let i=0;i<n;i++){const a=(rot+i*360/n)*Math.PI/180;p.push((cx+r*Math.cos(a)).toFixed(1)+','+(cy+r*Math.sin(a)).toFixed(1))}return p.join(' ')}
function mShape(s,cx,cy,r,fill){
  const f={white:'#fff',grey:'#9a9a9a',black:'#1a1a1a'}[fill],st=`fill="${f}" stroke="#1a1a1a" stroke-width="2.5" stroke-linejoin="round"`;
  if(s==='circle')return`<circle cx="${cx}" cy="${cy}" r="${r}" ${st}/>`;
  if(s==='square')return`<rect x="${cx-r*.85}" y="${cy-r*.85}" width="${r*1.7}" height="${r*1.7}" ${st}/>`;
  if(s==='triangle')return`<polygon points="${polyPts(3,cx,cy+r*.15,r*1.1,-90)}" ${st}/>`;
  if(s==='diamond')return`<polygon points="${polyPts(4,cx,cy,r*1.05,-90)}" ${st}/>`;
  return`<polygon points="${polyPts(6,cx,cy,r,0)}" ${st}/>`;
}
function mCell(c){const r=(c.count===1?[12,19,28]:[6.5,11,16])[c.size];return`<svg class="cell" viewBox="0 0 100 100">${POS[c.count].map(([x,y])=>mShape(c.shape,x,y,r,c.fill)).join('')}</svg>`}
const mKey=c=>[c.shape,c.count,c.fill,c.size].join('|');
function genMatrix(seed,rules){
  const r=rng(seed),g=[0,1,2].map(()=>[{},{},{}]);
  for(const a of Object.keys(DOM)){
    const D=DOM[a],rule=rules[a]||'fixed';let f;
    if(rule==='fixed'){const v=pick(D,r);f=()=>v}
    else if(rule==='const'){const vs=shuffle(D,r).slice(0,3);f=(i)=>vs[i]}
    else if(rule==='col'){const vs=shuffle(D,r).slice(0,3);f=(i,j)=>vs[j]}
    else if(rule==='prog'){const st=[0,1,2].map(()=>Math.floor(r()*(D.length-2))),up=r()<.5;f=(i,j)=>D[st[i]+(up?j:2-j)]}
    else{const vs=shuffle(D,r).slice(0,3),sh=r()<.5?1:2;f=(i,j)=>vs[(j+i*sh)%3]}
    for(let i=0;i<3;i++)for(let j=0;j<3;j++)g[i][j][a]=f(i,j);
  }
  const ans=g[2][2],vary=Object.keys(rules),fixed=Object.keys(DOM).filter(a=>!rules[a]);
  const seen=new Set([mKey(ans)]),dis=[];
  const add=c=>{if(dis.length<4&&!seen.has(mKey(c))){seen.add(mKey(c));dis.push(c)}};
  const inM=(a,v)=>g.flat().some(c=>c[a]===v);
  if(vary.length>=2){const[a,b]=shuffle(vary,r);const va=DOM[a].filter(v=>v!==ans[a]&&inM(a,v)),vb=DOM[b].filter(v=>v!==ans[b]&&inM(b,v));if(va.length&&vb.length)add({...ans,[a]:pick(va,r),[b]:pick(vb,r)})}
  const single=[];for(const a of vary)for(const v of DOM[a])if(v!==ans[a])single.push({...ans,[a]:v});
  const sh=shuffle(single,r);sh.filter(c=>vary.every(a=>inM(a,c[a]))).forEach(add);sh.forEach(add);
  for(const a of shuffle(fixed,r))for(const v of shuffle(DOM[a],r))add({...ans,[a]:v});
  const opts=shuffle([ans,...dis],r);
  const cells=[];for(let i=0;i<3;i++)for(let j=0;j<3;j++)cells.push(i===2&&j===2?'<div><span class="qm">?</span></div>':`<div>${mCell(g[i][j])}</div>`);
  return{q:`<div class="mx">${cells.join('')}</div><div class="mute" style="text-align:center;font-size:16px;font-weight:500">Какой фрагмент должен стоять на месте знака вопроса?</div>`,opts:opts.map(mCell),ans:opts.indexOf(ans),grid:true};
}
const MR=[
 [11,{shape:'const'}],[12,{count:'prog'}],[13,{fill:'latin'}],[14,{shape:'latin'}],
 [15,{size:'prog',fill:'const'}],[16,{count:'prog',shape:'const'}],[17,{shape:'latin',fill:'latin'}],[18,{count:'latin',size:'prog'}],
 [19,{shape:'latin',count:'prog',fill:'const'}],[20,{fill:'latin',size:'latin',shape:'col'}],[21,{shape:'latin',count:'latin',fill:'latin'}],[22,{shape:'latin',count:'prog',size:'latin'}],
 [23,{shape:'latin',count:'latin',fill:'latin',size:'prog'}],[24,{shape:'latin',count:'latin',fill:'latin',size:'latin'}],[25,{shape:'const',count:'prog',fill:'latin',size:'latin'}],
 [26,{shape:'latin',count:'prog',fill:'col',size:'latin'}],[27,{shape:'latin',count:'latin',fill:'latin',size:'latin'}],[28,{shape:'col',count:'latin',fill:'latin',size:'latin'}]
].map(([s,r])=>genMatrix(s,r));

/* ===== весы ===== */
const FWC={C:'#d7263d',S:'#1f6fd1',T:'#f2a900',D:'#13a05a',H:'#7b3fc4'};
function fwOne(t,x,y,s){const c=FWC[t],st=`fill="${c}" stroke="#141414" stroke-width="1.5" stroke-linejoin="round"`,r=s/2;
  if(t==='C')return`<circle cx="${x}" cy="${y}" r="${r}" ${st}/>`;
  if(t==='S')return`<rect x="${x-r*.9}" y="${y-r*.9}" width="${r*1.8}" height="${r*1.8}" ${st}/>`;
  if(t==='T')return`<polygon points="${polyPts(3,x,y+r*.15,r*1.15,-90)}" ${st}/>`;
  if(t==='D')return`<polygon points="${polyPts(4,x,y,r*1.1,-90)}" ${st}/>`;
  return`<polygon points="${polyPts(6,x,y,r,0)}" ${st}/>`}
function fwPile(str,cx,base,s=24,per=4){let out='';const a=str.split('');for(let k=0;k<a.length;k++){const row=Math.floor(k/per),inRow=Math.min(per,a.length-row*per),col=k%per;out+=fwOne(a[k],cx+(col-(inRow-1)/2)*(s+4),base-s/2-row*(s+4),s)}return out}
function fwScale(l,r,q){return`<svg class="scale${q?' scale-q':''}" viewBox="0 0 340 120"><polygon points="170,86 156,114 184,114" fill="#555"/><line x1="16" y1="86" x2="324" y2="86" stroke="#555" stroke-width="5" stroke-linecap="round"/>${fwPile(l,90,80)}${q?'<text x="250" y="72" font-size="46" font-weight="800" text-anchor="middle" fill="#888" font-family="Inter,sans-serif">?</text>':fwPile(r,250,80)}</svg>`}
function fwOpt(str){const rows=Math.ceil(str.length/4);return`<svg class="cell" viewBox="0 0 120 80">${fwPile(str,60,(80+rows*26)/2,22,4)}</svg>`}
const FW_ITEMS=[
 [{C:1,S:2},[['S','CC']],'SS',['CCCC','CCC','SC','CCCCC','C']],
 [{C:1,T:3},[['T','CCC']],'TC',['CCCC','CCC','CCCCC','TT','CC']],
 [{C:2,S:1},[['C','SS']],'CC',['SSSS','SSS','CS','SSSSS','C']],
 [{C:1,S:2,T:4},[['S','CC'],['T','SS']],'T',['CCCC','CCC','SC','SSC','CCCCCC']],
 [{C:1,S:3,D:2},[['S','CCC'],['D','CC']],'SD',['CCCCC','DD','SS','CCCC','DDD']],
 [{C:1,S:2,T:3},[['S','CC'],['T','SC']],'TT',['SSS','SSC','TC','SSSS','CCCCC']],
 [{C:2,S:3},[['CCC','SS']],'SSSS',['CCCCCC','CCCCC','CCCC','SSSC','SSCC']],
 [{C:1,S:2,T:3,D:4},[['S','CC'],['T','SC'],['D','TC']],'DS',['TT','TS','DD','TTC','SS']],
 [{C:3,S:2,T:6},[['CC','SSS'],['T','CC']],'TS',['SSSS','CCC','SSS','TCS','CC']],
 [{C:2,S:5,T:3},[['S','CT'],['TT','CCC']],'SC',['TCC','TT','SS','TTT','CCC']],
 [{C:4,S:6,T:3,D:12},[['CCC','SS'],['S','TT'],['D','CCC']],'DT',['SST','CCCC','CTTT','SS','CCTT']],
 [{C:3,S:4,T:5,D:6},[['CCCC','SSS'],['CT','SS'],['D','CC']],'DS',['TT','CCC','ST','DD','CCCC']]
];
const wsum=(w,s)=>s.split('').reduce((a,c)=>a+w[c],0);
const FW=(()=>{const r=rng(404);return FW_ITEMS.map(([w,eqs,tg,opts])=>{
  eqs.forEach(([a,b])=>{if(wsum(w,a)!==wsum(w,b))console.error('Весы не сходятся',a,b)});
  const W=wsum(w,tg);if(opts.filter(o=>wsum(w,o)===W).length!==1||wsum(w,opts[0])!==W)console.error('Неоднозначный ответ',tg,opts);
  const ord=shuffle([0,1,2,3,4],r);
  return{q:`<div class="scales">${eqs.map(([a,b])=>fwScale(a,b)).join('')}${fwScale(tg,'',true)}</div><div class="mute" style="text-align:center;font-size:16px;font-weight:500">Что уравновесит последние весы?</div>`,opts:ord.map(k=>fwOpt(opts[k])),ans:ord.indexOf(0),grid:true};
})})();

/* ===== кубики ===== */
function bdFace(t,x,y,s){const R='#c8102e',W='#fff';
  const tri={2:[[x,y],[x+s,y],[x,y+s]],3:[[x,y],[x+s,y],[x+s,y+s]],4:[[x+s,y],[x+s,y+s],[x,y+s]],5:[[x,y],[x+s,y+s],[x,y+s]]}[t];
  return`<rect x="${x}" y="${y}" width="${s}" height="${s}" fill="${t===1?R:W}"/>`+(tri?`<polygon points="${tri.map(p=>p.join(',')).join(' ')}" fill="${R}"/>`:'')}
function bdTarget(p,n,grid,bs){const s=60,W=s*n;let o='';p.forEach((t,k)=>{o+=bdFace(t,(k%n)*s,Math.floor(k/n)*s,s)});
  if(grid)for(let k=1;k<n;k++)o+=`<line x1="${k*s}" y1="0" x2="${k*s}" y2="${W}" stroke="#888" stroke-width="2"/><line x1="0" y1="${k*s}" x2="${W}" y2="${k*s}" stroke="#888" stroke-width="2"/>`;
  return`<svg viewBox="0 0 ${W} ${W}" style="width:calc(${bs} * ${n} + ${(n-1)*4+2}px);height:auto;display:block;border:3px solid #888;border-radius:4px">${o}</svg>`}
const BD=[
 {p:[1,1,0,0],n:2,lim:45,grid:true},{p:[1,0,0,1],n:2,lim:45,grid:true},{p:[4,5,3,2],n:2,lim:60,grid:true},
 {p:[2,3,5,4],n:2,lim:60,grid:false},{p:[4,1,1,2],n:2,lim:60,grid:false},
 {p:[1,0,1,0,1,0,1,0,1],n:3,lim:120,grid:true},{p:[4,1,5,1,1,1,3,1,2],n:3,lim:120,grid:false},
 {p:[5,0,0,1,5,0,1,1,5],n:3,lim:120,grid:false},{p:[2,1,3,1,0,1,5,1,4],n:3,lim:120,grid:false},
 {p:[4,5,4,3,2,3,4,5,4],n:3,lim:120,grid:false}
];
const BD_MAX=BD.reduce((a,b)=>a+(b.n===2?2:7),0);

/* ===== общий раннер выбора ответа ===== */
function runMC(cfg,done){
  let i=0,raw=0,zeros=0;
  const next=()=>{
    if(i>=cfg.items.length||zeros>=cfg.stop)return done(raw,cfg.items.length);
    const it=cfg.items[i];
    h(`<div class="top"><span>${cfg.title}</span><span>задание ${i+1} из ${cfg.items.length}</span></div>${cfg.time?TB:''}<div class="q">${it.q}</div><div class="opts${it.grid?' grid':''}">${it.opts.map((o,k)=>`<button class="opt" data-k="${k}">${o}</button>`).join('')}</div>`);
    let t=null,fin=false;
    const finish=k=>{if(fin)return;fin=true;t&&t.stop();const ok=k===it.ans;raw+=ok?1:0;zeros=ok?0:zeros+1;i++;setTimeout(next,120)};
    app.querySelectorAll('.opt').forEach(b=>b.onclick=()=>finish(+b.dataset.k));
    if(cfg.time)t=timer(app.querySelector('.tb'),cfg.time,()=>finish(-1));
  };
  next();
}

/* ===== арифметика ===== */
function runAR(done){
  let i=0,raw=0,zeros=0;
  const next=()=>{
    if(i>=ARI.length||zeros>=3)return done(raw,ARI.length);
    const[q,a]=ARI[i];
    h(`<div class="top"><span>Арифметика</span><span>задача ${i+1} из ${ARI.length}</span></div>${TB}<div class="q">${esc(q)}</div><form class="row" id="f"><input class="txt" id="a" inputmode="decimal" autocomplete="off" placeholder="Ответ числом"><button class="btn">Ответить</button></form>`);
    const inp=document.getElementById('a');inp.focus();let fin=false;
    const finish=v=>{if(fin)return;fin=true;t.stop();const n=parseFloat(String(v).replace(',','.').replace(/[^\d.\-]/g,''));const ok=n===a;raw+=ok?1:0;zeros=ok?0:zeros+1;i++;setTimeout(next,120)};
    const t=timer(app.querySelector('.tb'),30,()=>finish(inp.value));
    document.getElementById('f').onsubmit=e=>{e.preventDefault();if(inp.value.trim())finish(inp.value)};
  };
  next();
}

/* ===== повторение цифр ===== */
function runDS(done){
  const voice=document.getElementById('voice')?.checked;
  const r=rng(505),parts=[{name:'Прямой порядок',from:2,to:9,tr:s=>s},{name:'Обратный порядок',from:2,to:8,tr:s=>s.slice().reverse()},{name:'По возрастанию',from:2,to:9,tr:s=>s.slice().sort((a,b)=>a-b)}];
  const seq=len=>{const s=[];while(s.length<len){const d=1+Math.floor(r()*9);if(!s.includes(d))s.push(d)}return s};
  const plan=parts.map(p=>{const L=[];for(let len=p.from;len<=p.to;len++)L.push([seq(len),seq(len)]);return L});
  const max=plan.reduce((a,p)=>a+p.length*2,0);
  let raw=0,pi=0,li=0,ti=0,fails=0;
  if(voice&&window.speechSynthesis)speechSynthesis.speak(new SpeechSynthesisUtterance(' '));
  const say=d=>{if(!voice||!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(String(d));u.lang='ru-RU';u.rate=1.1;speechSynthesis.cancel();speechSynthesis.speak(u)};
  const step=()=>{
    if(pi>=parts.length)return done(raw,max);
    if(li>=plan[pi].length||(ti===0&&fails>=2)){pi++;li=0;ti=0;fails=0;return pi<parts.length?partIntro():done(raw,max)}
    const s=plan[pi][li][ti];
    h(`<div class="top"><span>Повторение цифр · ${parts[pi].name}</span><span>${s.length} цифр, попытка ${ti+1}</span></div><div class="digit" id="dg"></div><p class="mute" style="text-align:center">Смотрите внимательно</p>`);
    const dg=document.getElementById('dg');let k=0;
    const show=()=>{if(k>=s.length){dg.textContent='';return setTimeout(ask,400)}dg.textContent=s[k];say(s[k]);setTimeout(()=>{dg.textContent='';k++;setTimeout(show,300)},700)};
    setTimeout(show,800);
    const ask=()=>{
      h(`<div class="top"><span>Повторение цифр · ${parts[pi].name}</span><span>${s.length} цифр, попытка ${ti+1}</span></div><div class="q">Введите цифры ${pi===0?'в том же порядке':pi===1?'в обратном порядке':'по возрастанию'}</div><form class="row" id="f"><input class="txt" id="a" inputmode="numeric" autocomplete="off" placeholder="Например: 3 8 1"><button class="btn">Ответить</button></form>`);
      const inp=document.getElementById('a');inp.focus();
      document.getElementById('f').onsubmit=e=>{e.preventDefault();const got=inp.value.replace(/\D/g,'');const ok=got===parts[pi].tr(s).join('');
        raw+=ok?1:0;if(ti===0){fails=ok?0:1;ti=1}else{fails+=ok?0:1;ti=0;li++;if(fails<2)fails=0}step()};
    };
  };
  const partIntro=()=>{h(`<div class="card"><h2>${parts[pi].name}</h2><p>${pi===0?'Повторите цифры точно в том порядке, в каком они появились.':pi===1?'Теперь повторите цифры <b>с конца</b>. Например, показали 3 8 1, вводите 1 8 3.':'Теперь введите цифры <b>по возрастанию</b>. Например, показали 7 2 5, вводите 2 5 7.'}</p><button class="btn" id="go">Начать</button></div>`);document.getElementById('go').onclick=step};
  partIntro();
}

/* ===== кубики ===== */
function runBD(done){
  let i=0,raw=0,fails=0;
  const next=()=>{
    if(i>=BD.length||fails>=2)return done(raw,BD_MAX);
    const it=BD[i],n=it.n,cur=Array(n*n).fill(0),bs=n===2?'min(96px,22vw)':'min(80px,19vw)';
    h(`<div class="top"><span>Кубики</span><span>узор ${i+1} из ${BD.length}</span></div>${TB}<div class="bd"><figure>${bdTarget(it.p,n,it.grid,bs)}<figcaption>Образец</figcaption></figure><figure><div class="bd-grid" id="g" style="grid-template-columns:repeat(${n},var(--bs));--bs:${bs}"></div><figcaption>Ваши кубики: нажимайте, чтобы поворачивать</figcaption></figure></div><div class="feedback" id="fb"></div>`);
    const g=document.getElementById('g');let fin=false;
    const draw=()=>{g.innerHTML=cur.map((t,k)=>`<button data-k="${k}" aria-label="кубик ${k+1}"><svg viewBox="0 0 60 60">${bdFace(t,0,0,60)}</svg></button>`).join('');
      g.querySelectorAll('button').forEach(b=>b.onclick=()=>{if(fin)return;const k=+b.dataset.k;cur[k]=(cur[k]+1)%6;draw();check()})};
    const t=timer(app.querySelector('.tb'),it.lim,()=>{if(fin)return;fin=true;fails++;document.getElementById('fb').textContent='Время вышло';i++;setTimeout(next,900)});
    const check=()=>{if(cur.every((v,k)=>v===it.p[k])){fin=true;const el=t.elapsed();t.stop();fails=0;let pts=n===2?2:4;if(n===3){const q=el/it.lim;pts+=q<=.4?3:q<=.6?2:q<=.8?1:0}raw+=pts;document.getElementById('fb').textContent='Узор собран';i++;setTimeout(next,700)}};
    draw();
  };
  next();
}

/* ===== поиск символов ===== */
function runSS(done){
  const r=rng(606),rows=[];
  for(let k=0;k<60;k++){const a=Math.floor(r()*16);let b;do{b=Math.floor(r()*16)}while(b===a);const yes=r()<.5;
    const near=[PAIR[a],PAIR[b]].filter(x=>x!==a&&x!==b),pool=[...Array(16).keys()].filter(x=>x!==a&&x!==b);
    const grp=[];while(grp.length<5){const x=r()<.45&&near.length?pick(near,r):pick(pool,r);if(!grp.includes(x))grp.push(x)}
    if(yes)grp[Math.floor(r()*5)]=r()<.5?a:b;
    rows.push({t:[a,b],g:grp,yes:grp.includes(a)||grp.includes(b)})}
  let i=0,ok=0,bad=0,end=false;
  h(`<div class="top"><span>Поиск символов</span><span id="cnt">строка 1</span></div>${TB}<div id="row"></div><div class="row" style="justify-content:center;gap:16px"><button class="btn" id="y" style="min-width:150px">Да</button><button class="btn ghost" id="n" style="min-width:150px">Нет</button></div>`);
  const draw=()=>{const x=rows[i];document.getElementById('cnt').textContent='строка '+(i+1);document.getElementById('row').innerHTML=`<div class="ss"><div class="grp tg">${x.t.map(glyph).join('')}</div><div class="sep"></div><div class="grp">${x.g.map(glyph).join('')}</div></div>`};
  const finish=()=>{if(end)return;end=true;t.stop();done(Math.max(0,ok-bad),rows.length)};
  const ans=v=>{if(end)return;(v===rows[i].yes)?ok++:bad++;i++;if(i>=rows.length)return finish();draw()};
  document.getElementById('y').onclick=()=>ans(true);document.getElementById('n').onclick=()=>ans(false);
  const t=timer(app.querySelector('.tb'),120,finish);draw();
}

/* ===== шифровка ===== */
function runCD(done){
  const r=rng(707),sym=shuffle([...Array(16).keys()],r).slice(0,9),padOrd=shuffle([0,1,2,3,4,5,6,7,8],r),N=135,seq=[];
  for(let k=0;k<N;k++){let d;do{d=Math.floor(r()*9)}while(k&&d===seq[k-1]);seq.push(d)}
  let i=0,ok=0,end=false;
  h(`<div class="top"><span>Шифровка</span><span id="cnt">0 верно</span></div>${TB}<div class="key">${sym.map((s,k)=>`<div><b>${k+1}</b>${glyph(s)}</div>`).join('')}</div><div class="strip" id="strip"></div><div class="pad">${padOrd.map(k=>`<button data-k="${k}" aria-label="символ">${glyph(sym[k])}</button>`).join('')}</div>`);
  const draw=()=>{document.getElementById('strip').innerHTML=[0,1,2,3,4].map(o=>seq[i+o]===undefined?'':`<span class="${o?'':'cur'}">${seq[i+o]+1}</span>`).join('')};
  const finish=()=>{if(end)return;end=true;t.stop();done(ok,N)};
  app.querySelectorAll('.pad button').forEach(b=>b.onclick=()=>{if(end)return;if(+b.dataset.k===seq[i])ok++;document.getElementById('cnt').textContent=ok+' верно';i++;if(i>=N)return finish();draw()});
  const t=timer(app.querySelector('.tb'),120,finish);draw();
}

/* ===== экраны ===== */
function home(){
  const names=Object.keys(S.people);
  h(`<h1>Когнитивный профиль по схеме Векслера</h1>
  <div class="card"><p>Тест повторяет устройство шкалы Векслера для взрослых (WAIS-IV): <b>10 основных субтестов в том же порядке</b>, те же 4 шкалы, те же лимиты времени и правила остановки после серии ошибок.</p>
  <p>Займёт около 60 минут. Проходите в тишине, по одному человеку на устройство, без бумаги и калькулятора. Можно прерваться: пройденные субтесты сохраняются в этом браузере.</p>
  <div class="note"><b>Важно.</b> Задания здесь авторские: оригинальные материалы и нормы Векслера защищены авторским правом издателя и выдаются только психологам. Поэтому тест показывает <b>профиль сильных и слабых сторон</b>, а не официальный IQ. Для клинического IQ нужно очное тестирование у психолога.</div></div>
  <div class="card"><h2>Кто проходит?</h2><form class="row" id="f"><input class="txt" id="nm" placeholder="Имя" autocomplete="off" maxlength="40"><button class="btn">Начать</button></form>
  ${names.length?`<p class="mute" style="margin:18px 0 10px">Или продолжить:</p><div class="row">${names.map(n=>`<button class="btn ghost" data-n="${esc(n)}">${esc(n)} · ${Object.keys(S.people[n].res||{}).length} из 10</button>`).join('')}</div>`:''}
  ${names.length?`<p style="margin:18px 0 0"><button class="btn ghost" id="cmp">Сравнить всех участников</button></p>`:''}</div>`);
  document.getElementById('f').onsubmit=e=>{e.preventDefault();const n=document.getElementById('nm').value.trim();if(!n)return;S.people[n]=S.people[n]||{res:{}};S.current=n;save();battery()};
  app.querySelectorAll('[data-n]').forEach(b=>b.onclick=()=>{S.current=b.dataset.n;save();battery()});
  const c=document.getElementById('cmp');if(c)c.onclick=compare;
}
function battery(){
  const p=me(),res=p.res,nextS=SUB.find(s=>!res[s.id]),cnt=Object.keys(res).length;
  h(`<div class="top"><span>Участник: <b>${esc(S.current)}</b></span><span>пройдено ${cnt} из 10</span></div>
  <h1>${nextS?'Субтесты':'Все субтесты пройдены'}</h1>
  <div class="row" style="margin-bottom:22px">${nextS?`<button class="btn" id="go">${cnt?'Продолжить':'Начать'}: ${nextS.name}</button>`:''}${cnt?`<button class="btn ${nextS?'ghost':''}" id="rs">Результаты</button>`:''}<button class="btn ghost" id="hm">Сменить участника</button></div>
  <div class="list">${SUB.map((s,k)=>{const x=res[s.id];return`<div class="st${x?' done':''}"><div class="n">${k+1}</div><div class="t"><b>${s.name}</b><span>${IDX[s.idx]} · около ${s.min} мин</span></div><div class="r">${x?`${x.raw} из ${x.max}`:`<button class="btn ghost" data-s="${s.id}" style="min-height:44px;padding:0 16px;font-size:16px">Пройти</button>`}</div></div>`}).join('')}</div>`);
  const go=document.getElementById('go');if(go)go.onclick=()=>intro(nextS);
  const rs=document.getElementById('rs');if(rs)rs.onclick=results;
  document.getElementById('hm').onclick=home;
  app.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>intro(SUB.find(s=>s.id===b.dataset.s)));
}
function intro(s){
  const k=SUB.indexOf(s)+1;
  h(`<div class="top"><span>Участник: <b>${esc(S.current)}</b></span><span>субтест ${k} из 10</span></div><div class="card"><h2>${k}. ${s.name}</h2>${s.intro}<div class="row" style="margin-top:20px"><button class="btn" id="go">Начать</button><button class="btn ghost" id="bk">Назад</button></div></div>`);
  document.getElementById('bk').onclick=battery;
  document.getElementById('go').onclick=()=>s.run((raw,max)=>{me().res[s.id]={raw,max,at:new Date().toISOString()};save();
    h(`<div class="card"><h2>${s.name}: готово</h2><p>Результат: <b>${raw} из ${max}</b></p><div class="row"><button class="btn" id="nx">Дальше</button></div></div>`);
    document.getElementById('nx').onclick=battery});
}
function calc(p){
  const pct=id=>{const x=p.res[id];return x?Math.round(x.raw/x.max*100):null};
  const idx={};for(const k in IDX){const v=SUB.filter(s=>s.idx===k).map(s=>pct(s.id)).filter(v=>v!==null);idx[k]=v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
  const all=SUB.map(s=>pct(s.id)).filter(v=>v!==null);
  return{pct,idx,total:all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length):null};
}
function results(){
  const p=me(),c=calc(p);
  const lines=[`Когнитивный профиль: ${S.current}`,...Object.keys(IDX).map(k=>`${IDX[k]}: ${c.idx[k]??'нет'}%`),'',...SUB.filter(s=>p.res[s.id]).map(s=>`${s.name}: ${p.res[s.id].raw} из ${p.res[s.id].max}`),`Общий балл: ${c.total}%`];
    h(`<div class="top"><span>Участник: <b>${esc(S.current)}</b></span><span>пройдено ${Object.keys(p.res).length} из 10</span></div>
  <h1>Профиль: ${esc(S.current)}</h1>
  <div class="idx">${Object.keys(IDX).map(k=>`<div class="card"><div class="mute" style="font-size:15px">${IDX[k]}</div><div class="v">${c.idx[k]===null?'·':c.idx[k]+'%'}</div><div class="bar"><i style="width:${c.idx[k]||0}%"></i></div></div>`).join('')}</div>
  <div class="card"><h2>По субтестам</h2>${SUB.map(s=>{const x=p.res[s.id];return`<div class="res-row"><div class="row"><span><b>${s.name}</b> <span class="mute">· ${IDX[s.idx]}</span></span><span>${x?`${x.raw} из ${x.max}`:'не пройден'}</span></div><div class="bar"><i style="width:${x?c.pct(s.id):0}%"></i></div></div>`}).join('')}
  <p style="margin:18px 0 0"><b>Общий балл: ${c.total??'·'}%</b></p></div>
  <div class="note" style="margin-bottom:24px">Проценты показывают долю набранных баллов, а не IQ. В «Поиске символов» и «Шифровке» максимум, как в оригинале, почти недостижим за 120 секунд, поэтому скорость обработки всегда выглядит ниже остальных шкал. Сравнивать честно можно людей между собой (на одних и тех же заданиях) и шкалы одного человека в первом приближении: субтесты разной сложности.</div>
  <div class="row"><button class="btn" id="cp">Скопировать результат</button><button class="btn ghost" id="bk">К субтестам</button><button class="btn ghost" id="cm">Сравнить участников</button></div><p class="mute" id="cpok" style="margin-top:10px"></p>`);
  document.getElementById('cp').onclick=()=>{const txt=lines.join('\n');(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>document.getElementById('cpok').textContent='Скопировано, можно вставить в мессенджер',()=>{document.getElementById('cpok').innerHTML='<textarea style="width:100%;height:220px;font:15px Inter">'+esc(txt)+'</textarea>'})};
  document.getElementById('bk').onclick=battery;document.getElementById('cm').onclick=compare;
}
function compare(){
  const names=Object.keys(S.people);
  h(`<h1>Сравнение участников</h1><div class="card tbl-wrap"><table><tr><th>Участник</th>${Object.values(IDX).map(v=>`<th>${v}</th>`).join('')}<th>Общий</th><th>Пройдено</th></tr>
  ${names.map(n=>{const c=calc(S.people[n]);return`<tr><td><b>${esc(n)}</b></td>${Object.keys(IDX).map(k=>`<td>${c.idx[k]===null?'·':c.idx[k]+'%'}</td>`).join('')}<td><b>${c.total===null?'·':c.total+'%'}</b></td><td>${Object.keys(S.people[n].res).length} из 10</td></tr>`}).join('')}</table></div>
  <p class="mute">Сравнение видно только на этом устройстве. Если проходили на разных телефонах, обменяйтесь результатами кнопкой «Скопировать результат».</p><button class="btn ghost" id="bk">Назад</button>`);
  document.getElementById('bk').onclick=()=>S.current&&S.people[S.current]?battery():home();
}
S.current&&S.people[S.current]?battery():home();
</script>
